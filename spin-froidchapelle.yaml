description: The Spin se trouve au lac de Féronval. Le parc a un grand câble et un câble 2.0, ainsi qu'un aquapark et un skatepark.

cables:
  - name: Grand câble
    description: Boucle de cinq pylônes à vitesse fixe, ou réduite pendant les slow sessions.
  - name: Petit câble (2.0)
    direction: "2.0"
    description: Câble débutant en aller-retour à vitesse réglable, pour les cours privés.

opening:
  note: >-
    Réservation recommandée. Fermé en cas de gel ou de sécheresse. Slow sessions sur le grand câble: le mercredi de 13:00 à 15:00 de début mai à fin septembre, les week-ends et jours fériés de 11:00 à 13:00 de début avril à fin septembre.
  exceptions:
    - kind: hours
      label: Horaires réduits
      dates:
        - "2026-10-28"
        - "2026-10-30"
      open: "14:00"
      close: "17:00"
      note: Réservation obligatoire

