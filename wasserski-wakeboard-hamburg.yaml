  note: >-
    Die Saison läuft von April bis Oktober und ist beendet. In der Wintersaison von November
    bis März gibt es Sonderöffnungen. Der Nikolauslauf findet am 5. Dezember 2026 von 12 bis
    15 Uhr statt.

