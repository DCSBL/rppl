# Relaxed yamllint config for hand-authored park data files (long URLs are normal here).
# Park files are native block-style YAML; scripts/validate_parks.py rejects `{ }` / `[ ]`.
extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
