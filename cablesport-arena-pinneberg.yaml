  note: >-
    Die Saison läuft von Mai bis Oktober. Im Oktober ist mittwochs von 15 Uhr bis
    Sonnenuntergang und samstags, sonntags und an Feiertagen von 13 Uhr bis Sonnenuntergang
    geöffnet. Die Zeiten gelten auch bei schlechtem Wetter.

