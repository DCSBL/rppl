    Im Oktober ist mittwochs bis freitags von 15:00 bis 17:00 und samstags und sonntags von
    13:00 bis 18:00 geöffnet, montags und dienstags ist Ruhetag. Die Saison endet am 30.
    Oktober 2026. Es gibt keine Slots, Tickets gibt es vor Ort.

