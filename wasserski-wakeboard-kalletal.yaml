      und Funbox. Der See wird nur für Wasserski und Wakeboard genutzt.

opening:
  source_url: "https://www.wasserski-kalletal.de/oeffnungszeiten"
  booking: optional
  note: >-
    Die Saison 2026 lief bis 25. Oktober. Im Oktober ist mittwochs bis freitags von 13 bis
    18 Uhr und am Wochenende von 12 bis 18 Uhr geöffnet, an Feiertagen wie sonntags.

