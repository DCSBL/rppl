# App Store marketing stills. Rendered by `node render.mjs` (see Docs/Marketing.md).
#
# text:  one word per line; **bold** words get the accent colour.
# screenshot / watch_screenshot: CI export name (e.g. `02-logbook-3-1`, see release-screenshots.yml).
# Per slide you may override: formats, align, background, watch, logo.
# Devices are the Apple frames in device-frames/ (see its README); photos live in photos/ (paths relative to this file).
# layout: header = photo + logo + name + tagline, no devices.
# layout: search = photo, logo, headline, phone and watch (needs image, screenshot, watch_screenshot).
# layout: usp = logo, title and icon rows (icons: code, lock-phone, no-euro); with `image` they sit on a photo.

formats:
  # App Store screenshots (iPhone): 1242x2688 only, App Store Connect rejects any other size for this slot.
  iphone-6.5: { w: 1242, h: 2688, folder: screenshots/iphone-6.5 }
  # Product page header and search results: 16:9 only.
  header-16x9: { w: 5244, h: 2950, folder: product-page-header/16x9 }
  search-16x9: { w: 5244, h: 2950, folder: search-results/16x9 }

defaults:
  align: left # left | center | right (text edge lines up with the phone edge)
  formats: [iphone-6.5]
  background: { top: "#e4e6f0", bottom: "#5f8299" }
  colors: { text: "#000000", accent: "#5aaec9", usp: "#245a78" }

# Used only with --allow-fallback (PR preview): committed site shots instead of CI exports.
fallbacks:
  02-logbook-3-1: ../web/public/shots/logbook.webp
  04-session-tracked-2: ../web/public/shots/session.webp
  06-parks-open-1: ../web/public/shots/parks.webp
  watch-01-start: ../web/public/shots/watch.webp
  01-start: ../web/public/shots/watch.webp
  06-live-riding: ../web/public/shots/watch.webp

slides:
  - id: buddy
    text: "**YOUR** CABLEPARK BUDDY"
    logo: true
    screenshot: 02-logbook-3-1

  - id: track
    text: "TRACK **YOUR** SESSIONS"
    align: right
    screenshot: 04-session-tracked-2
    watch_screenshot: 06-live-riding
    watch: { side: right }

  - id: spots
    text: "FIND **YOUR** SPOTS"
    screenshot: 06-parks-open-1

  - id: usp
    layout: usp
    image: photos/last-slide.jpg
    object_position: "50% 50%"
    title: Rppl
    items:
      - { icon: code, text: "Free and Open Source" }
      - { icon: lock-phone, text: "Your data stays yours, there is no Rppl cloud." }
      - { icon: no-euro, text: "No subscriptions, ever." }

  - id: header
    layout: header
    image: photos/header.jpg
    title: rppl
    tagline: "YOUR **CABLEPARK** BUDDY"
    formats: [header-16x9]

  - id: search
    layout: search
    image: photos/search.jpg
    title: rppl
    text: "**YOUR** CABLEPARK BUDDY"
    screenshot: 04-session-tracked-2
    watch_screenshot: 06-live-riding
    formats: [search-16x9]
