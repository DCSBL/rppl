# App Store marketing stills. Rendered by `node render.mjs` (see Docs/Marketing.md).
#
# text:  one word per line; **bold** words get the accent colour.
# screenshot / watch_screenshot: CI export name (e.g. `02-logbook-3-1`, see release-screenshots.yml).
# Per slide you may override: formats, align, background, watch, logo.
# Devices are the Apple frames in device-frames/ (see its README); photos live in photos/ (paths relative to this file).
# layout: header = photo + logo + name + tagline, no devices, placed in the safe area Apple leaves uncropped (template.css).
# layout: search = photo, logo, headline, phone and watch (needs image, screenshot, watch_screenshot).
# layout: duo = iPhone Duo slide. text_at {x, y, size, stack} places the headline (stack: one word per line), logo_at {x, y, size} the logo,
#   devices [{ kind: outer | inner | watch, x, y, w, file | screenshot }] the framed devices in format pixels, back to front.
#   `file` is a committed screenshot (relative to this file), `screenshot` a CI export name. The Duo shots are committed in duo-shots/
#   because the CI Duo export is not good enough yet; swap a device to `screenshot:` once it is.
# layout: usp = logo, title and icon rows (icons: code, lock-phone, no-euro); with `image` they sit on a photo.

formats:
  # App Store screenshots (iPhone, medium): 1206x2622 only; App Store Connect rejects other sizes for this slot.
  iphone-6.3: { w: 1206, h: 2622, folder: screenshots/iphone-6.3 }
  # App Store screenshots (iPhone Duo): the inner display, landscape. Apple's Duo sizes are 2034x1398, 1398x2034, 2853x2007 and 2007x2853.
  duo-inner: { w: 2853, h: 2007, folder: screenshots/iphone-duo }
  # Product page header: 16:9. Search results: 3:2, because the App Store crops a 16:9 image to 3:2 and cuts the sides.
  header-16x9: { w: 5244, h: 2950, folder: product-page-header/16x9 }
  search-3x2: { w: 3840, h: 2560, folder: search-results/3x2 }

defaults:
  align: left # left | center | right (text edge lines up with the phone edge)
  formats: [iphone-6.3]
  background: { top: "#e4e6f0", bottom: "#5f8299" }
  colors: { text: "#000000", accent: "#5aaec9", usp: "#245a78" }

# Used only with --allow-fallback (PR preview): committed site shots instead of CI exports.
fallbacks:
  02-logbook-3-1: ../web/public/shots/logbook.webp
  04-session-tracked-2: ../web/public/shots/session.webp
  06-parks-open-1: ../web/public/shots/parks.webp
  watch-01-start: ../web/public/shots/watch.webp
  01-start: ../web/public/shots/watch.webp
  06-live-riding: ../web/public/shots/watch.webp

slides:
  - id: buddy
    text: "**YOUR** CABLEPARK BUDDY"
    logo: true
    screenshot: 02-logbook-3-1

  - id: track
    text: "TRACK **YOUR** SESSIONS"
    align: right
    screenshot: 04-session-tracked-2
    watch_screenshot: 06-live-riding
    watch: { side: right }

  - id: spots
    text: "FIND **YOUR** SPOTS"
    screenshot: 06-parks-open-1

  - id: usp
    layout: usp
    image: photos/last-slide.jpg
    object_position: "50% 50%"
    title: Rppl
    items:
      - { icon: code, text: "Free and Open Source." }
      - { icon: lock-phone, text: "Your data stays yours, there is no Rppl cloud." }
      - { icon: no-euro, text: "No subscriptions, ever." }

  - id: header
    layout: header
    image: photos/header.jpg
    title: rppl
    tagline: "YOUR **CABLEPARK** BUDDY"
    formats: [header-16x9]

  - id: search
    layout: search
    image: photos/search.jpg
    title: rppl
    text: "**YOUR** CABLEPARK BUDDY"
    screenshot: 04-session-tracked-2
    watch_screenshot: 06-live-riding
    formats: [search-3x2]

  # iPhone Duo (formats: duo-inner). Numbered after the iPhone slides, so these files are 07-10 in screenshots/iphone-duo/.
  - id: duo-buddy
    layout: duo
    text: "**YOUR** CABLEPARK BUDDY"
    text_at: { x: 170, y: 680, size: 190, stack: true }
    logo_at: { x: 170, y: 440, size: 200 }
    devices:
      - { kind: outer, file: duo-shots/outer-sessions.jpg, x: 1480, y: 110, w: 1300 }
    formats: [duo-inner]

  - id: duo-track
    layout: duo
    text: "TRACK **YOUR** SESSIONS"
    text_at: { x: 130, y: 100, size: 150 }
    devices:
      - { kind: inner, file: duo-shots/inner-session.jpg, x: 900, y: 520, w: 1900 }
      - { kind: outer, file: duo-shots/outer-session.jpg, x: 110, y: 430, w: 1010 }
      - { kind: watch, screenshot: 06-live-riding, x: 790, y: 1130, w: 520 }
    formats: [duo-inner]

  - id: duo-spots
    layout: duo
    text: "FIND **YOUR** SPOTS"
    text_at: { x: 130, y: 100, size: 150 }
    devices:
      - { kind: inner, file: duo-shots/inner-parks.jpg, x: 350, y: 430, w: 2150 }
    formats: [duo-inner]

  - id: duo-usp
    layout: usp
    image: photos/last-slide.jpg
    object_position: "50% 97.8%" # the lake and the cable pole at the bottom of the portrait photo
    title: Rppl
    items:
      - { icon: code, text: "Free and Open Source." }
      - { icon: lock-phone, text: "Your data stays yours, there is no Rppl cloud." }
      - { icon: no-euro, text: "No subscriptions, ever." }
    formats: [duo-inner]
