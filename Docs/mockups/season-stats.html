<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season stats mockup</title>
<style>
:root{--text:#033b4f;--card:#fff;--muted:#045876;--accent:#045876;--dist:#045876;--laps:#6b3fc4;--time:#8a6a00;--water:#1f5fbf;--air:#4a6275;--energy:#c2332f;--bg:#dff0f6;--fill:rgba(3,59,79,.12);--hair:rgba(3,59,79,.08)}
@media(prefers-color-scheme:dark){:root{--text:#fff;--card:#033b4f;--muted:#dbebfb;--accent:#47bfd7;--dist:#47bfd7;--laps:#bba0f5;--time:#ffd54a;--water:#6fb2ff;--air:#a9c1d4;--energy:#ff7a70;--bg:#021f2b;--fill:rgba(255,255,255,.14);--hair:rgba(255,255,255,.08)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:390px}
h1{font-size:34px;margin:0}.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.tile{background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(12px);border:1px solid var(--hair);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.wide{grid-column:1/-1}
.hd{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--muted));display:flex;align-items:center;gap:6px;justify-content:space-between}
.hd span{display:flex;gap:6px;align-items:center}
.val{font-size:30px;font-weight:700;line-height:1}.val small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.foot{font-size:12px;color:var(--muted)}
.row{display:flex}.row>div{flex:1;text-align:center}.row>div+div{border-left:1px solid var(--fill)}.row .val{font-size:24px}.row .foot{margin-top:4px}
hr{border:0;border-top:1px solid var(--fill);margin:0;width:100%}
svg{width:100%;height:auto;display:block;overflow:visible}
.ax{font-size:9px;fill:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--fill);border-radius:8px;overflow:hidden;text-transform:none;letter-spacing:0}
.seg button{all:unset;font-size:11px;padding:2px 8px;color:var(--muted);cursor:pointer}.seg .on{background:var(--fill);color:var(--text);font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.lock{align-items:center;text-align:center;padding:28px 16px}.lock p{margin:0;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--fill);width:100%;overflow:hidden}.bar b{display:block;height:100%;background:var(--laps)}
.ctl{display:flex;gap:8px;margin-bottom:12px}.ctl button{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--fill);color:var(--muted)}.ctl .on{background:var(--fill);color:var(--text)}
</style>
</head>
<body>
<main>
<h1>Logbook</h1>
<p class="sub">Sessions and sets</p>
<div class="ctl">Mock state: <button data-n="24" class="on">24 sessions</button><button data-n="3">3 sessions</button></div>

<div class="tile">
  <div class="hd" style="--c:var(--accent)"><span>Total</span></div>
  <div class="row">
    <div><div class="val" id="t-s"></div><div class="foot">Sessions</div></div>
    <div><div class="val" id="t-d"></div><div class="foot">Distance</div></div>
    <div><div class="val">41,6<small>km/h</small></div><div class="foot">Max speed</div></div>
  </div><hr>
  <div class="foot" id="t-f"></div>
</div>

<div id="stats" class="grid">
  <!-- Distance / duration -->
  <div class="tile wide" style="--c:var(--dist)">
    <div class="hd"><span id="d-hd">Distance per session</span>
      <div class="seg"><button class="on" data-m="dist">km</button><button data-m="time">time</button></div></div>
    <div class="val" id="d-val"></div>
    <svg id="d-chart" viewBox="0 0 320 100"></svg>
    <div class="foot" id="d-foot"></div>
  </div>

  <!-- Laps -->
  <div class="tile" style="--c:var(--laps)">
    <div class="hd"><span>Laps</span></div>
    <div class="val" id="l-val"></div>
    <svg id="l-chart" viewBox="0 0 150 60"></svg>
    <div class="foot" id="l-foot"></div>
  </div>

  <!-- Calories -->
  <div class="tile" style="--c:var(--energy)">
    <div class="hd"><span>Calories</span></div>
    <div class="val" id="e-val"></div>
    <svg id="e-chart" viewBox="0 0 150 60"></svg>
    <div class="foot" id="e-foot"></div>
  </div>

  <!-- Temperatures -->
  <div class="tile wide" style="--c:var(--water)">
    <div class="hd"><span>Water and air</span></div>
    <div class="legend"><span><i style="background:var(--water)"></i>Water 16 °C avg</span><span><i style="background:var(--air)"></i>Air 21 °C avg</span></div>
    <svg id="w-chart" viewBox="0 0 320 110"></svg>
    <div class="foot">Warmest water: 21 °C in Aug</div>
  </div>
</div>
</main>
<script>
const MN=["Apr","May","Jun","Jul","Aug","Sep","Oct"],PER=[2,3,4,4,5,4,2]; // sessions per month; empty days never appear
let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
const ses=[];PER.forEach((c,m)=>{const peak=1-Math.abs(m-4)*.12;for(let i=0;i<c;i++){const t=(.6+rnd()*.8)*peak;ses.push({m,dist:+(15*t).toFixed(1),time:+(2.8*t).toFixed(1),laps:Math.round(45*t),kcal:Math.round(580*t)})}});
const W=[11,13,16,18,21,17,12],A=[12,17,20,24,27,19,13];
const sum=k=>ses.reduce((a,x)=>a+x[k],0),fmt=n=>n.toLocaleString('nl-NL',{maximumFractionDigits:1});
function bars(id,k,w,h,col,labels){const d=ses.map(x=>x[k]),m=Math.max(...d),bw=w/d.length;let s='',last=-1;
 d.forEach((v,i)=>{const bh=v/m*(h-14);s+=`<rect x="${i*bw+bw*.1}" y="${h-14-bh}" width="${bw*.8}" height="${bh}" rx="${Math.min(3,bw/2)}" fill="${col}"/>`;
  if(labels&&ses[i].m!=last){last=ses[i].m;s+=`<text class="ax" x="${i*bw}" y="${h}">${MN[last]}</text>`}});
 document.getElementById(id).innerHTML=s}
function lines(id,series,w,h){const all=series.flatMap(s=>s.d),lo=Math.min(...all)-2,hi=Math.max(...all)+2,n=series[0].d.length;let s='';
 for(const t of [0,.5,1]){const y=(h-14)*t;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--fill)"/><text class="ax" x="${w}" y="${y-2}" text-anchor="end">${Math.round(hi-(hi-lo)*t)}°</text>`}
 series.forEach(se=>{const p=se.d.map((v,i)=>`${i*(w-20)/(n-1)+4},${(h-14)*(1-(v-lo)/(hi-lo))}`);s+=`<polyline points="${p.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;p.forEach(q=>{const[x,y]=q.split(',');s+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${se.c}"/>`})});
 MN.forEach((m,i)=>s+=`<text class="ax" x="${i*(w-20)/(n-1)+4}" y="${h}" text-anchor="middle">${m}</text>`);
 document.getElementById(id).innerHTML=s}
const n=ses.length;
function draw(k){bars('d-chart',k,320,100,'var(--dist)',true);const dist=k=='dist';
 document.getElementById('d-hd').textContent=dist?'Distance per session':'Duration per session';
 document.getElementById('d-val').innerHTML=dist?`${fmt(sum('dist')/n)}<small>km avg</small>`:`${fmt(sum('time')/n)}<small>u avg</small>`;
 const best=Math.max(...ses.map(x=>x[k]));document.getElementById('d-foot').textContent=`Best: ${fmt(best)} ${dist?'km':'u'}`}
document.getElementById('t-s').textContent=n;document.getElementById('t-d').innerHTML=`${Math.round(sum('dist'))}<small>km</small>`;
document.getElementById('t-f').textContent=`${Math.round(n*1.9)} sets · ${sum('laps')} laps`;
draw('dist');bars('l-chart','laps',150,60,'var(--laps)');bars('e-chart','kcal',150,60,'var(--energy)');
document.getElementById('l-val').innerHTML=`${sum('laps')}<small>total</small>`;document.getElementById('l-foot').textContent=`Avg ${Math.round(sum('laps')/n)} per session`;
document.getElementById('e-val').innerHTML=`${fmt(sum('kcal'))}<small>kcal</small>`;document.getElementById('e-foot').textContent=`Avg ${Math.round(sum('kcal')/n)} per session`;
lines('w-chart',[{d:A,c:'var(--air)'},{d:W,c:'var(--water)'}],320,110);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x==b));draw(b.dataset.m)});
// season charts need 5+ sessions; below that show only Total
document.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ctl button').forEach(x=>x.classList.toggle('on',x==b));document.getElementById('stats').hidden=+b.dataset.n<5});
</script>
</body>
</html>
