  note: >-
    Im Oktober 2026 ist die Wasserskianlage samstags und sonntags von 12:00 bis 18:00
    geöffnet. Von Juni bis August ist montags bis donnerstags 13:00 bis 19:00, freitags
    13:00 bis 20:00, samstags 11:00 bis 20:00 und sonntags 11:00 bis 19:00 geöffnet. Der
    Aquapark öffnet wieder im Mai 2027.

