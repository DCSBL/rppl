      and able to swim 50 m.

opening:
  source_url: "https://boxendpark.com/cable-tow/"
  booking: required
  note: >-
    Session times vary through the year and are shown in the online booking system.
    Slow sessions run on weekends and bank holidays (April to October) from 10:00 to 12:00,
    plus Monday, Wednesday and Friday in August from 12:00 to 14:00.

