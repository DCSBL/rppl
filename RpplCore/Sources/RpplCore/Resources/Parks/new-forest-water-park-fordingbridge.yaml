opening:
  source_url: "https://www.newforestwaterpark.co.uk/opening-times/"
  note: >-
    Wakeboarding runs from Easter weekend to October and the park is closed from November until the following Easter.
    The page lists start times only. April and October: Friday from 13:30, weekends from 09:30.
    May and June: Wednesday to Friday from 13:00, weekends from 09:00.
    July: weekdays from 11:00 in the first three weeks, then every day from 09:00 through August.
    September: Wednesday to Friday from 13:00, weekends from 09:00.
    Activity times vary, check the booking page.

