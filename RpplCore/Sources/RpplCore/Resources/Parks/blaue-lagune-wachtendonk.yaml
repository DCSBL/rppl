opening:
  source_url: "https://www.blauelagune.de/oeffnungszeiten/"
  booking: required
  note: >-
    Die Saison 2026 begann am 4. April, der Wakepark ist jetzt in der Winterpause. Die
    Zeiten wechseln pro Zeitraum und stehen mit Daten auf der Website. Eintritt gibt es nur
    mit Online-Ticket.

