cables:
  - name: Waterskibaan
    # Site describes it as a rectangular course ("rechthoekig traject") over the recreatiemeer,
    # towed at ca. 30 km/u - a full-size loop, not a 2-point cable. Exact travel direction
    # (cw/ccw) isn't stated and no source map/satellite view was clear enough to trace points.
    description: >-
      Rectangular waterski/wakeboard cable course over the recreatiemeer, towed at roughly
      30 km/u. Includes a funpark with a kicker and a rail. Beginners welcome; ages 8-14 only
      with adult supervision.

