description: >-
  Waterskibaan en wakeboardbaan onderdeel van BetuweStrand Recreatie, een familiecamping met
  strandbad en waterpark in de Betuwe. Instructeurs begeleiden beginners; het funpark heeft een
  kicker en een rail voor gevorderde wakeboarders. Personen van 8 t/m 14 jaar mogen alleen onder
  toezicht van een volwassene de baan gebruiken. Honden zijn niet toegestaan rondom de baan.
