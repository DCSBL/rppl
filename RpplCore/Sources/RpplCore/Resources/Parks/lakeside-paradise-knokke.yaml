description: >-
  Waterskiing, wakeboarding and wakeskating cable park on the Duinenwater lake in
  Knokke-Heist, Belgium, with three separate cables (Pro, Rookie, Small 2.0). The park cites a
  720 m cable length among the longest in Europe, five pylons around the lake, up to 8
  riders per round / 25 participants per hour, a 45 kW electric motor on green power, and
  under 50 dB measured at 30 m.
