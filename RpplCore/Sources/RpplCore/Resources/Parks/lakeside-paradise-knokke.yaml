        lon: 3.27753248281371
    description: >-
      15 obstacle/jump combinations. From age 12 (younger needs the cable operators'
      permission). Booking required, 1h or 2h blocks, reservations start on the hour.
  - name: Rookie Cable
    direction: cw
    points:
      - lat: 51.3372357401546
        lon: 3.27320441428826
      - lat: 51.3367116648781
        lon: 3.27644118378766
      - lat: 51.3361467867279
        lon: 3.27680199247845
      - lat: 51.335548290739
        lon: 3.27545853023206
      - lat: 51.3364779958063
        lon: 3.27292003239036
    description: >-
      Newest cable at the park; runs at a slower speed than Pro Cable, 6 obstacles. From
