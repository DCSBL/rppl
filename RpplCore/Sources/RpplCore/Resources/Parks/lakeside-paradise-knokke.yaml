name: Lakeside Paradise
address: Duinenwater 41, 8300 Knokke-Heist
timezone: Europe/Brussels
# No dock pin on the official site (only a generic address-level Google Maps embed on
# /info/ligging/). This is a geocode of the address itself (OpenStreetMap Nominatim, which
# resolved it directly to the "Lakeside Paradise" building), not a traced/confirmed dock point.
location:
  lat: 51.3377928
  lon: 3.2731542

# Nearest official VMM surface-water temperature station that's still reporting: "Knokke/
# Heistlaan/Isabellavaart" on the Isabellavaart canal, ~2.7 km from the dock (verified against
# the live API on 2026-09-28: 15-min readings up to the same day). Duinenwater itself is a
# private former sand-quarry lake with no station of its own - estimate only, not measured at
# the park.
water_temperature: { provider: vmm_be, station_id: "01265376042" }

phone: "+32 (0)50 60 60 35"
email: info@lakesideparadise.be
