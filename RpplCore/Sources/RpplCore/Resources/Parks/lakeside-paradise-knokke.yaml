name: Lakeside Paradise
address: Duinenwater 41, 8300 Knokke-Heist
timezone: Europe/Brussels
# Geocode of the address, not a confirmed dock point.
location:
  lat: 51.3377928
  lon: 3.2731542

water_temperature: { provider: vmm_be, station_id: "01265376042" }

phone: "+32 (0)50 60 60 35"
email: info@lakesideparadise.be
website: https://www.lakesideparadise.be/cable-park/cablepark/
links:
  - { kind: booking, url: "https://www.lakesideparadise.be/cable-park/reserveren/" }
  - { kind: instagram, url: "https://www.instagram.com/lakeside.paradise/" }
  - { kind: facebook, url: "https://www.facebook.com/lakesideparadise" }

wakesys: true

# Pro Cable turns left (ccw) and Rookie Cable right (cw), per the reserveren page.
cables:
  - name: Pro Cable
    direction: ccw
    description: >-
      15 obstacle/jump combinations. From age 12 (younger needs the cable operators'
      permission). Booking required, 1h or 2h blocks, reservations start on the hour.
  - name: Rookie Cable
    direction: cw
    description: >-
      Newest cable at the park; runs at a slower speed than Pro Cable, 6 obstacles. From
      about age 6-7 (must be able to swim to shore independently with their board).
      Booking required, 1h or 2h blocks, reservations start on the half hour.
  - name: Small Cable 2.0
    direction: 2d
    description: >-
      Staff-operated, gradual/instructor-paced start with one-on-one guidance. The
      recommended first introduction before booking the full-size cables. Reservations
      start on the hour.

opening:
  booking: required
  note: >-
    Pro Cable: open daily (by reservation) from 30 March through the autumn school break;
    in winter, weekends and Flemish school holidays only, 12:00-16:00. Small Cable 2.0: from
    May, weekends only (by reservation), daily in July and August. Rookie Cable: Wednesdays,
    Saturdays and Sundays afternoons (by reservation), daily in July and August; same reduced
    weekend/school-holiday winter schedule as Pro Cable.

# Non-member rates; member prices and private rentals are not listed.
