opening:
  source_url: "https://www.wasserski-bleibtreusee.de/oeffnungszeiten"
  booking: optional
  note: >-
    Im öffentlichen Betrieb ist dienstags, donnerstags und freitags von 14:30 bis 17:00 und
    am Wochenende von 12:00 bis 17:00 geöffnet, montags ist Ruhetag. Mittwochs gelten eigene
    Zeiten pro Datum. Ab Mai läuft der Lift samstags von 12:00 bis 14:00 mit 26 statt 30
    km/h.

