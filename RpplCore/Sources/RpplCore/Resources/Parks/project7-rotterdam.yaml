# Drop-in windows (rules) and fixed-start blocks (slots). A block is available
# when it fits inside an open window. Source: project7cablepark.nl/openingstijden
opening:
  booking: required
  note: >-
    Book a block online at least 3 hours in advance and check in at the desk 30 minutes
    before start. Easter, Ascension and Pentecost use weekend hours in April and May.
