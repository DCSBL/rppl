opening:
  source_url: "https://www.strandparx.de/kontakt/"
  booking: optional
  note: >-
    Die Hauptsaison läuft von Mai bis 3. Oktober, ab dem 14. Mai täglich ab 12 Uhr. In der
    Nebensaison ab dem 4. Oktober ist samstags, sonntags und an Feiertagen geöffnet,
    wetterbedingte Schließung ist möglich. Am 6. Dezember 2026 gibt es von 14 bis 18 Uhr
    eine Sonderöffnung.

