description: >-
  Waterskiën is inclusief instructie, waterski's en zwemvest; extra materiaal zoals een wetsuit
  kun je bijkopen. Ook wakeboarden mogelijk. Van mei t/m september is er op zondagen de Easyride:
  de baan draait langzamer en een bootje brengt je terug naar de start, ideaal voor beginners.
  Adviesleeftijd: waterskiën vanaf ca. 10 jaar, wakeboarden vanaf ca. 12 jaar.
