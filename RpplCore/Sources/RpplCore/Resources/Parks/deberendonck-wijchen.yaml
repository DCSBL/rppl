# Drop-in windows. Doordeweeks in mei/september is dinsdag t/m vrijdag (maandag gesloten).
# Source: deberendonck.nl openingstijden skibaan
opening:
  booking: required
  booking_minutes: [90, 180]
  note: >-
    Reserveer je starttijd online. De baan draait bij minimaal 3 deelnemers; groepen vanaf 15
    personen kunnen ook buiten openingstijd reserveren. We stoppen uiterlijk bij zonsondergang.
    Tijdens feestdagen of bij besloten groepen kunnen openingstijden afwijken.
