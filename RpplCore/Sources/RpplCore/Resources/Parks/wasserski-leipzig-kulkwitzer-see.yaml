opening:
  source_url: "https://www.wasserski-leipzig.de/"
  booking: none
  note: >-
    Die Saison läuft von April bis Oktober. Im Juli ist mittwochs bis sonntags und an
    Feiertagen von 12 bis 20 Uhr geöffnet, montags und dienstags geschlossen. In der
    Übergangszeit zum Herbst läuft die Anlage erst ab drei Personen. Zahlung nur bar.

