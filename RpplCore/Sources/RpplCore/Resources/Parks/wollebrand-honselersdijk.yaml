opening:
  booking: required
  note: >-
    Book a block online in advance. Arrive 30 minutes before your start time. Outside
    regular hours the park can be booked exclusively. Monday, Tuesday and (in September)
    Thursday are by request only. Closed on Koningsdag. Hemelvaart and Pinksteren use
    weekend hours. During summer holiday (18 July-30 August) the park uses August hours.
