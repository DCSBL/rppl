# Seasonal drop-in windows (rules) plus fixed-start 80-minute blocks (slots).
# Monday and Tuesday, and Thursday in September, are booking-only ("op aanvraag") and
# have no listed hours. Source: kabelskibaan.nl/openingstijden.
opening:
  booking: required
  note: >-
    Book a block online in advance. Arrive 30 minutes before your start time. Outside
    regular hours the park can be booked exclusively. Monday, Tuesday and (in September)
    Thursday are by request only. Closed on Koningsdag. Hemelvaart and Pinksteren use
    weekend hours. During summer holiday (18 July–30 August) the park uses August hours.
  rules:
    - { label: April, months: [4], days: [weekend], open: "14:00", close: "17:00" }
    - { label: May, months: [5], days: [wed, thu, fri], open: "15:30", close: "20:00" }
    - { label: May, months: [5], days: [weekend], open: "12:30", close: "18:30" }
    - { label: June, months: [6], days: [wed, thu, fri], open: "15:30", close: "21:30" }
    - { label: June, months: [6], days: [weekend], open: "12:30", close: "20:00" }
    - { label: July, months: [7], days: [wed, thu, fri], open: "15:30", close: "21:30" }
    - { label: July, months: [7], days: [sat], open: "12:30", close: "21:30" }
    - { label: July, months: [7], days: [sun], open: "12:30", close: "20:00" }
    - { label: August, months: [8], days: [wed, thu, fri, sat], open: "12:30", close: "21:30" }
    - { label: August, months: [8], days: [sun], open: "12:30", close: "20:00" }
    - { label: September, months: [9], days: [wed, fri], open: "15:30", close: "20:00" }
