opening:
  booking: optional
  note: >-
    Reservations are not mandatory but guarantee a spot. Arrive 30 minutes before your
    start time. Outside regular hours the park can be booked exclusively.

facilities:
  - Rental (skis, wakeboard, wetsuit)
  - Restaurant (Wollebrand Lakehouse)
  - Groups / corporate outings

description: >-
  Open since 2002. Rates include water skis, life vest and instruction. Wakeboard rental
  requires ID. Youth up to 15 need supervisor permission. Onsite Wollebrand Lakehouse
  restaurant for food and drinks.
