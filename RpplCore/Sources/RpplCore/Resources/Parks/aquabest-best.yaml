name: Cablepark Aquabest
address: Ekkersweijer 2, 5681 RZ Best
timezone: Europe/Amsterdam
location:
  lat: 51.500230
  lon: 5.438156

# Nearest station that still reports (~34 km); closer ones stopped reporting.
water_temperature: { provider: rws_nl, station_id: lith.boven }

phone: +31 (0)499 392 121
email: info@cableparkaquabest.nl
website: https://www.cableparkaquabest.nl
links:
  - { kind: booking, url: "https://www.cableparkaquabest.nl/book-online" }
  - { kind: instagram, url: "https://www.instagram.com/cableparkaquabest/" }
  - { kind: facebook, url: "https://www.facebook.com/cableparkaquabest" }
  - { kind: youtube, url: "https://www.youtube.com/channel/UCaFERwQH-UVJ8cVWgQnb8kg?view_as=subscriber" }
