cables:
  - name: Cable
    description: >-
      Loop cable of over 800 m that runs 11 m above the lake, with 9 tow points ("meenemers")
      and 5 corners. 16 obstacles in the water. Minimum age is 10 for waterski and 12 for wakeboard.

opening:
  booking_minutes: [90, 180]
  note: >-
    The cable runs with at least 3 riders. It runs until sunset, so hours can differ with
    weather or large bookings. Closed on King's Day. Groups of 15 or more can arrange hours
    outside the schedule. Arrive 15 minutes early for gear. Free cancellation up to 48 hours
    before, rescheduling up to 24 hours before.
