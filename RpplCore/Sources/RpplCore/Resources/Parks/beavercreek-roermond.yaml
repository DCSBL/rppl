facilities:
  - Rental (wetsuit, wakeboard, obstacle board, helmet)
  - Restaurant and bar (Yacht5, separate operator)
  - Parking (about 80 spaces, EUR 2 per day)
  - Beginner course (Sundays 11:30-13:00)
  - Private cable
  - Groups / events

description: >-
  Cable park on the Maasplassen near Roermond. A ticket includes waterski or kneeboard, a life
  vest and a video instruction. Wakeboard costs extra.
