  - Changing rooms
  - Showers
  - Parking
  - Terrace next to the start dock

description: >-
  Cable wakeboard and waterski park on Almere's Weerwater lake. The main cable (ccw) runs past
  13 Shape obstacles; a small clinic cable, the Alta Twin (~200 m, adjustable speed), is used for
  beginner lessons. Floating docks ring the lake so a fallen rider can reach a boat-taxi pickup
  without a long swim.
