author: Rppl
name: Cablepark VIEW Almere
address: Bergsmapad 1, 1324 ZK Almere
timezone: Europe/Amsterdam
location:
  lat: 52.3581295
  lon: 5.2152087

# Nearest official Rijkswaterstaat surface-water temperature station that actually reports (Pampus,
# oost, ~8.7 km away, in the Markermeer) - checked via the WaterWebServices catalog/observation
# endpoints on 2026-09-27; closer Almere/Gooimeer "zwemwater" stations exist (surfstrandalmere,
# almerehaven.zwemstrand, …) but stopped reporting around 2010. Estimate only - not measured at the
# park itself.
water_temperature: { provider: rws_nl, station_id: pampus.oost }

phone: 085 - 402 12 28
email: info@cableparkviewalmere.nl
website: https://www.cableparkviewalmere.nl
links:
