    - { label: April, months: [4], days: [fri], open: "17:00", close: "19:00" }
    - { label: April, months: [4], days: [sat, sun], open: "12:00", close: "18:00" }
    - { label: May, months: [5], days: [thu, fri], open: "16:00", close: "20:00" }
    - { label: May, months: [5], days: [sat, sun], open: "12:00", close: "18:00" }
    - { label: June, months: [6], days: [wed, thu, fri], open: "15:00", close: "20:00" }
    - { label: June, months: [6], days: [sat, sun], open: "12:00", close: "20:00" }
    - { label: July-August, months: [7, 8], days: [tue, wed, thu, fri, sat, sun], open: "12:00", close: "20:00" }
