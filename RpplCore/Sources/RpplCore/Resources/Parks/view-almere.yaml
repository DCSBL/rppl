# Sources fetched 2026-09-27 (all from the park's own official domain):
#   https://www.cableparkviewalmere.nl/               (intro, obstacles, Alta Twin small cable)
#   https://www.cableparkviewalmere.nl/contact/        (address, phone, email, opening-hours table)
#   https://www.cableparkviewalmere.nl/tarieven/       (prices)
#   https://www.cableparkviewalmere.nl/faqs/           (booking policy, parking, changing rooms/showers)
#   https://www.cableparkviewalmere.nl/wakeboarden/    (Alta Twin clinic cable description)
# Main-cable direction (ccw) confirmed by the user, not stated on the site. Length/points left out
# (not confirmed). `location` is the Google Maps business pin for the confirmed official address
# (Bergsmapad 1, 1324 ZK Almere) - the site itself publishes no coordinates.
version: 1
id: view-almere
created_at: 2026-09-27
updated_at: 2026-09-28
history:
  - date: 2026-09-27
    description: initial
  - date: 2026-09-27
    description: add water_temperature (nearest reporting Rijkswaterstaat station, Pampus oost)
  - date: 2026-09-28
    description: >-
      water_temperature: pampus.oost had stopped reporting (stale since 2026-08-17) - switch to
      diemen.muidenbrug, the nearest still-reporting station
  - date: 2026-10-04
    description: store prices as numbers (amount, currency), same values
  - date: 2026-10-04
    description: group prices of the same name into options

author: Rppl
name: Cablepark VIEW Almere
address: Bergsmapad 1, 1324 ZK Almere
timezone: Europe/Amsterdam
location:
  lat: 52.3581295
  lon: 5.2152087

# Nearest official Rijkswaterstaat surface-water temperature station that actually reports
# (Diemen Muiden brug, ~13.9 km away). Re-checked 2026-09-28 via
# scripts/find-water-temperature-station.py: pampus.oost (~8.7 km, previously used) had stopped
# reporting (stale since 2026-08-17); all closer Almere/Gooimeer "zwemwater" stations (pampus.oost,
# surfstrandalmere, almerehaven.zwemstrand, …) are stale too, several since 2010. Estimate only -
# not measured at the park itself.
water_temperature: { provider: rws_nl, station_id: diemen.muidenbrug }

phone: 085 - 402 12 28
email: info@cableparkviewalmere.nl
website: https://www.cableparkviewalmere.nl
links:
  - { kind: booking, url: "https://cablepark-almere.recras.nl/bookprocess/?id=74" }
  - { kind: instagram, url: "https://www.instagram.com/cableparkviewalmere/" }
  - { kind: facebook, url: "https://www.facebook.com/cableparkviewalmere" }

cables:
  - name: Grote baan
    direction: ccw
  - name: Alta Twin
    description: Small clinic cable with adjustable speed, used for beginner lessons before moving to the main cable.
    length_m: 200 # site says "zo'n 200 meter" (approximate)

# Source: cableparkviewalmere.nl/contact/ opening-hours table (September 2026). Booking policy
# and rental/clinic pricing suggest no numbered/fixed blocks - riders just show up within a window.
