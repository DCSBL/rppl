opening:
  source_url: "https://www.wasserski-seilbahn.de/oeffnungszeiten/"
  booking: optional
  note: >-
    Im Oktober fährt der Lift samstags und sonntags von 14:00 bis 17:00. Von November bis
    März ist der Lift geschlossen. Bei schlechtem Wetter schließt die Anlage früher.

