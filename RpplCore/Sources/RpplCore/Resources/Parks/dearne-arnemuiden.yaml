links:
  - { kind: facebook, url: "https://www.facebook.com/wsbdearne" }
  - { kind: instagram, url: "https://www.instagram.com/wsbdearne/?hl=nl" }

cables:
  - name: Wakeboardbaan
    # Site's own description: a "tweemast-wakeboardbaan" (two-mast course) - a 2-point "2.0"
    # cable, not a full-size loop. No source map/satellite view to trace points from.
    direction: 2d
    description: >-
      Two-mast cable - you're the only rider on the water for your session, no queue and no
      swimming back after a fall.

opening:
  booking: required
  numbered: false
  note: >-
    The wakeboard/waterski cable runs May 1 through September 30 only (other De Arne facilities
    are open longer). Closed Saturdays. Evening hours by appointment.
  rules:
    - { label: Season, months: [5, 6, 7, 8, 9], days: [sun, mon, tue, wed, thu, fri], open: "09:00", close: "17:30" }

prices:
