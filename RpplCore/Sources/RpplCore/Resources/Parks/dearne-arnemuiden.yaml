# Nearest official Rijkswaterstaat surface-water temperature station (Arnemuiden Oranjeplaat,
# ~0.7 km from the dock - the same landmark the park's own directions use). Reports frequently
# (latest reading same-day as this lookup). Estimate only - not measured at the park itself.
