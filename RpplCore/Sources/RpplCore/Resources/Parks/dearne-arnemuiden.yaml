  - { name: 30 min, price: "€36", note: Includes helmet and impact vest }
  - { name: 60 min, price: "€72", note: Includes helmet and impact vest }
  - { name: Wakeboard/waterski rental, price: "€7", note: per person }
  - { name: Pro wakeboard rental, price: "€10", note: per person }
  - { name: Wetsuit rental, price: "€7", note: per person }
