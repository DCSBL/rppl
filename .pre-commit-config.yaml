repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        args:
          - "--skip=*.pbxproj,*.xcuserstate,*.png,*.jpg,Exports,RpplCore/.build,.swiftpm,DerivedData,tools"
          - "--ignore-words-list=te,crate,mot,inout,alllocations"

  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: bash scripts/git-hooks/run-swiftlint.sh
        language: system
        pass_filenames: false
        types: [swift]

      - id: xcode-gate
        name: Core tests + xcodebuild build/analyze
        entry: bash scripts/git-hooks/xcode-gate.sh
        language: system
        pass_filenames: false
        always_run: true
        types: [swift]
