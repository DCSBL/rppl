# Install the commit hook:
#   pre-commit install
# Heavy checks (Core tests, xcodebuild) run in GitHub Actions, not as a push hook.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        # Vite/TS configs often use JSONC (comments); strict JSON decode fails.
        exclude: (^|/)tsconfig.*\.json$
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        # marketing/photos: full-size photos, the 16:9 renders need 5244 px wide.
        exclude: ^Rppl(?:Watch)?/Resources/Exports/|^marketing/photos/
        stages: [pre-commit]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        exclude: ^Rppl(?:Watch)?/Resources/Exports/|package-lock\.json$|^marketing/device-frames/.*\.rtf$
        args:
          - "--skip=*.pbxproj,*.xcuserstate,*.png,*.jpg,*.xcstrings,Exports,Rppl/Resources/Exports,RpplWatch/Resources/Exports,RpplCore/.build,.swiftpm,DerivedData,tools"
          - "--ignore-words-list=te,crate,mot,inout,alllocations,als,openen,mappin,weerd,periode"
          # Park text in other languages: the `nl:`/`fr:`/`de:` lines of a language map (Docs/Parks.md#languages).
          - '--ignore-regex=^\s+(nl|fr|de|es|it|pt|pl|da|sv)(-[A-Za-z0-9]+)?:\s.*$'
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: sync-legal-md
        name: Sync LEGAL.md into app Resources
        entry: bash scripts/git-hooks/sync-legal-md.sh
        language: system
        pass_filenames: false
        files: ^(LEGAL\.md|Rppl/Resources/LEGAL\.md)$
        stages: [pre-commit]

      - id: format-xcstrings
        name: Format .xcstrings like Xcode
        entry: python3 scripts/format-xcstrings.py
        language: system
        files: \.xcstrings$
        stages: [pre-commit]

      - id: swiftlint
        name: SwiftLint
        entry: bash scripts/git-hooks/run-swiftlint.sh
        language: system
        pass_filenames: false
        types: [swift]
        stages: [pre-commit]
