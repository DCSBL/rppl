# Release branch. Xcode Cloud builds the branch release/X.Y.Z (Docs/Release.md), so every
# build of a version (betas, release candidates, final) lands in one Build Group.
#
# release published: validate the tag (format, on main), then push a marker commit to
# release/X.Y.Z: the tagged commit's files plus ci_scripts/release-marker.txt (tag, tagged
# commit, run id). That push starts the Xcode Cloud Release workflow.
#
# Why a marker commit and not the tagged commit itself: a branch created at a commit that is
# already in the repository brings no new commit, and Xcode Cloud does not start for it. The
# marker is always new, and it changes a file, so "Start if any file changes" holds. Each marker
# has the previous branch head as parent, so the push is always a fast-forward (no force push)
# and any tag on main can be released, in any order.
#
# The tag name is user input: it reaches the shell only through env, never interpolated.

name: Release branch

on:
  release:
    types: [published]

concurrency:
  group: release-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push-branch:
    name: push release branch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/prepare_release.py --release-branch --tag "$RELEASE_TAG"

      - name: Push marker commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! parent="$(git rev-parse --verify --quiet "refs/remotes/origin/${RELEASE_BRANCH}")"; then
            parent="$commit"
          fi
          # Tagged commit's files + the marker, built in a throwaway index.
          export GIT_INDEX_FILE="$(mktemp -u)"
          git read-tree "$commit"
          blob="$(printf 'tag=%s\ncommit=%s\nrun=%s\n' "$RELEASE_TAG" "$commit" "$GITHUB_RUN_ID" | git hash-object -w --stdin)"
          git update-index --add --cacheinfo "100644,${blob},ci_scripts/release-marker.txt"
          tree="$(git write-tree)"
          unset GIT_INDEX_FILE
          marker="$(git commit-tree "$tree" -p "$parent" \
            -m "Release ${RELEASE_TAG}" \
            -m "Xcode Cloud trigger. Tree of ${commit} plus ci_scripts/release-marker.txt.")"
          git push origin "${marker}:refs/heads/${RELEASE_BRANCH}"
