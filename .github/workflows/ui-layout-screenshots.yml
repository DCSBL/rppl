# Layout screenshots for wide and rotated windows, the stand-in for iPhone Duo until a real device or
# the Duo simulator is on the runners: iPad (regular width, live window resizing) and iPhone landscape,
# portrait and landscape, at the default and the largest accessibility text size.
# Runs RpplLayoutScreenshotTests only (it skips itself without RPPL_LAYOUT_SHOTS, so the other UI jobs never run it).
# Output: one artifact `layout-screenshots` with <device>-<text>/<screenshot>.png, linked in a PR comment.

name: UI layout screenshots

on:
  pull_request:
    branches: [main, 'wip/**']
  workflow_dispatch:

concurrency:
  group: layouts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (layouts)
    runs-on: ubuntu-24.04
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          # Park YAML is checked by parks-validate.yml and the Core tests, not by simulator runs.
          changed="$(printf '%s\n' "$changed" | grep -Ev '^RpplCore/Sources/RpplCore/Resources/Parks/.*\.ya?ml$' || true)"
          if printf '%s\n' "$changed" | grep -Eq '^(Rppl/|RpplCore/|RpplUITests/|Rppl\.xcodeproj/|scripts/ci/|\.github/workflows/ui-layout-screenshots\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  layouts:
    name: Layout screenshots ${{ matrix.variant }}
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: ipad-default, device: "iPad Pro 13-inch (M5)", text: large }
          - { variant: ipad-ax5, device: "iPad Pro 13-inch (M5)", text: accessibility-extra-extra-extra-large }
          - { variant: promax-default, device: "iPhone 17 Pro Max", text: large }
          - { variant: promax-ax5, device: "iPhone 17 Pro Max", text: accessibility-extra-extra-extra-large }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: xcodebuild test (RpplLayoutScreenshotTests)
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          TEXT: ${{ matrix.text }}
          TEST_RUNNER_RPPL_LAYOUT_SHOTS: "1"
        run: |
          set -euo pipefail
          udid="$(python3 scripts/ci/pick_simulator.py "$DEVICE")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" content_size "$TEXT"
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplLayoutScreenshotTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath Layouts.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee layouts.log

      - name: Collect screenshots
        if: ${{ !cancelled() }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/ci/export_screenshots.py Layouts.xcresult screenshots
          mkdir -p "out/$VARIANT"
          cp screenshots/*.png "out/$VARIANT/"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shots-layout-${{ matrix.variant }}
          path: out
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: result-layout-${{ matrix.variant }}
          path: |
            layouts.log
            Layouts.xcresult
          if-no-files-found: ignore
          retention-days: 7

  merge:
    name: Merge layout screenshots
    needs: [changes, layouts]
    if: ${{ !cancelled() && needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download cell screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: shots-layout-*
          path: merged
          merge-multiple: true

      - name: Upload one screenshot bundle
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: merged
          if-no-files-found: warn
          retention-days: 14

      # Fork PRs get a read-only token, so they only get the artifact.
      - name: Comment screenshot link
        if: ${{ steps.bundle.outputs.artifact-url && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- layout-screenshots -->'
          printf '%s\n### Layout screenshots (iPad and iPhone, portrait and landscape)\n\n[Download the zip](%s) · `%s`\n\nFolders: `<device>-<text>/layout-<screen>-<orientation>.png` (`ipad`/`promax`, `default`/`ax5`).\n' "$marker" "$ARTIFACT_URL" "${SHA:0:7}" > comment.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

      - name: Fail if any cell failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "A layout cell failed; see the cell logs."
          exit 1
