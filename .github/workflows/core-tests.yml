# RpplCore tests + coverage floor on macOS.
#
# Why this exists: RpplCoreTests ran nowhere in CI. Xcode Cloud tests the `Rppl` scheme (app
# targets only) and pr-checks.yml is Linux, where `swift test` cannot build (Compression is an
# Apple framework). Two regressions that unit tests in the repo already caught shipped for that
# reason. This job runs them on every PR that can change their result and fails when coverage
# drops below RpplCore/coverage-baseline.json (scripts/check-core-coverage.py).
#
# Cost: macOS minutes count 10x against a private repo's included minutes, so this only runs
# when RpplCore or the coverage tooling changes and cancels superseded runs. Docs/DevWorkflow.md
# explains how to move it elsewhere if the quota is a problem.

name: Core tests

on:
  pull_request:
    branches: [main]
    paths:
      - "RpplCore/**"
      - "scripts/check-core-coverage.py"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

concurrency:
  group: core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core tests + coverage
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo's local gate runs on 26.3 (Docs/DevWorkflow.md); match it so a coverage number
      # means the same thing here and on a laptop.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: RpplCore/.build
          # The sha makes every run save its own build; restore-keys picks the closest older one.
          key: core-build-${{ runner.os }}-${{ hashFiles('RpplCore/Package.swift', 'RpplCore/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            core-build-${{ runner.os }}-${{ hashFiles('RpplCore/Package.swift', 'RpplCore/Package.resolved') }}-

      - name: Test with coverage floor
        run: python3 scripts/check-core-coverage.py
