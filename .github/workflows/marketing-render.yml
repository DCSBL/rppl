# Marketing preview: renders the App Store assets (marketing/) from the committed website screenshots and checks
# sizes/alpha, so changes to marketing.yaml or the template are visible on the PR (download the artifact).
# The real assets are rendered from CI screenshots in release-screenshots.yml.
#
# No `paths:` filter: a never-triggered workflow leaves a required check pending forever. The workflow always
# starts; a `changes` job decides whether the real job runs, and a job skipped by `if` still reports success.

name: Marketing assets preview

on:
  pull_request:

concurrency:
  group: marketing-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (marketing)
    runs-on: ubuntu-24.04
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "marketing=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Resolve outside `if` so a failed `git diff` aborts instead of looking like "no changes".
          changed="$(git diff --name-only "$BASE...$HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(marketing/|assets/rppl\.svg$|web/public/shots/|scripts/ci/(test_)?check_marketing_assets\.py$|\.github/workflows/marketing-render\.yml$)'; then
            echo "marketing=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=false" >> "$GITHUB_OUTPUT"
          fi

  render:
    name: Render App Store assets
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install renderer
        working-directory: marketing
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: |
          (cd marketing && node --test)
          python3 -m unittest discover -s scripts/ci -p 'test_check_marketing_assets.py'

      - name: Render with site screenshots
        working-directory: marketing
        run: node render.mjs --allow-fallback --out ../marketing-out

      - name: Check sizes and alpha
        run: python3 scripts/ci/check_marketing_assets.py marketing-out

      - uses: actions/upload-artifact@v7
        with:
          name: appstore-assets-preview
          path: marketing-out
          retention-days: 14
