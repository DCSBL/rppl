# macOS checks: build the app once, then run every test target against that build.
# Public repo = free macOS runners. The Release build stays in Xcode Cloud (Docs/Release.md);
# nothing here signs, archives or uploads.
#
# `build` compiles the Rppl and RpplWatch schemes with `xcodebuild build-for-testing` (iOS + embedded
# Watch + widgets + the test runners) and uploads Build/Products as the `test-products` artifact. The
# other jobs download it and run `xcodebuild test-without-building`, so the app is compiled once per
# run instead of once per job (about 10 minutes of each simulator job before this). A compile error
# shows up in `build` in a few minutes and the test jobs never start.
#
# Warnings and errors from the compiler become inline PR annotations through
# .github/xcode-problem-matcher.json (GitHub caps this at 10 per step, 50 per job; the full log is
# the `build-log` artifact). The Linux core-tests.yml stays as the fast, container-based check.
#
# The job names `Build app (dry run)` and `Smoke (app unit tests)` are required checks in the main
# ruleset, so they keep their names. Merge on green `build` + `smoke`; the rest is the real
# verification. A merged PR cancels its own runs (cancel-on-merge.yml) unless it is "scary"
# (label `full-ci`, release/CI/project paths).
#
# No `paths:` filter: the jobs always report a status, so they can be required checks. The UI jobs
# are the slow ones (about 16 minutes of iPhone test run, 5 of Watch), so they skip when a PR touches
# nothing they exercise. A job skipped by `if` still reports success.
#
# The first app launch on a fresh simulator can take over a minute (automation session + dyld) and
# used to time out the first UI test (#579): every UI job runs one throwaway test first, like the
# Watch jobs always did.

name: macOS CI

on:
  pull_request:
    branches: [main, 'wip/**']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (macOS CI)
    runs-on: ubuntu-24.04
    outputs:
      phone: ${{ steps.filter.outputs.phone }}
      watch: ${{ steps.filter.outputs.watch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect UI-test relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Anything but a PR (push to main, manual run) runs everything.
          if [ "$EVENT" != pull_request ]; then
            echo "phone=true" >> "$GITHUB_OUTPUT"; echo "watch=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Resolve outside `if` so a failed `git diff` aborts instead of looking like "no changes".
          changed="$(git diff --name-only "$BASE...$HEAD")"
          # Park data lives in RpplCore but is checked by parks-validate.yml and the Core tests; a
          # YAML-only PR does not need 40 minutes of simulator time (pushes to main still run everything).
          changed="$(printf '%s\n' "$changed" | grep -Ev '^RpplCore/Sources/RpplCore/Resources/Parks/.*\.ya?ml$' || true)"
          shared='^(RpplCore/|Rppl\.xcodeproj/|scripts/ci/|\.github/workflows/macos-ci\.yml$|\.github/xcode-problem-matcher\.json$)'
          if printf '%s\n' "$changed" | grep -Eq "$shared|^(Rppl/|RpplWidgets/|RpplUITests/)"; then
            echo "phone=true" >> "$GITHUB_OUTPUT"
          else
            echo "phone=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$shared|^(RpplWatch/|RpplWatchUITests/)"; then
            echo "watch=true" >> "$GITHUB_OUTPUT"
          else
            echo "watch=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # The name is pinned by the main ruleset (required check); it is the build-for-testing step now.
    name: Build app (dry run)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version

      # Both schemes into one DerivedData: the RpplWatch scheme also builds the iOS app, so the
      # second invocation only adds the Watch test runner. ONLY_ACTIVE_ARCH keeps it to arm64, which
      # is what the simulators on these runners run.
      - name: xcodebuild build-for-testing (iOS + Watch)
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          for scheme in Rppl RpplWatch; do
            case "$scheme" in
              Rppl) platform="iOS Simulator" ;;
              RpplWatch) platform="watchOS Simulator" ;;
            esac
            xcodebuild build-for-testing \
              -project Rppl.xcodeproj \
              -scheme "$scheme" \
              -destination "generic/platform=${platform}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              ONLY_ACTIVE_ARCH=YES \
              2>&1 | tee -a build.log
          done

      # tar keeps the executable bits and symlinks inside the .app bundles, which a plain artifact
      # upload drops. Swift modules and debug symbols are not needed to run the tests.
      - name: Pack test products
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DerivedData/Build/Products"
          ls "$products"
          tar -C "$products" --exclude='*.swiftmodule' --exclude='*.dSYM' -cf test-products.tar .
          du -h test-products.tar

      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: test-products.tar
          compression-level: 1
          retention-days: 1

      - name: Warning / error summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Build"
            echo "errors: $(sort -u build.log | grep -cE '^/.+:[0-9]+:[0-9]+: error: ' || true)"
            echo "warnings: $(sort -u build.log | grep -cE '^/.+:[0-9]+:[0-9]+: warning: ' || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke (app unit tests)
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: App unit tests (iOS Simulator)
        shell: bash
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" iphonesimulator)"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplTests \
            -resultBundlePath RpplTests.xcresult \
            2>&1 | tee app-tests.log

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: |
            app-tests.log
            RpplTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Core and release script tests (macOS)
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: RpplCore tests + coverage floor
        shell: bash # pipefail: keep the script's exit code through tee
        run: |
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          python3 scripts/check-core-coverage.py 2>&1 | tee core-tests.log

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-log
          path: core-tests.log
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI tests (iPhone Simulator)
    needs: [build, changes]
    if: needs.changes.outputs.phone == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      # Seeded mock logbook + frozen clock: the app reads `-rpplUITest` (Debug only), see
      # Rppl/App/UITestFixtures.swift. The screenshot test runs here too (about a minute, no extra
      # build); release-screenshots.yml does the same for releases. Screenshots go to the one
      # `screenshots` artifact, see `layouts-merge`.
      - name: xcodebuild test (RpplUITests)
        shell: bash
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" iphonesimulator)"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          # Boot first: a cold simulator made the runner fail to launch and every wait time out.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm-up: the first launch of the app on a fresh simulator took 75 s and timed out the
          # first test (#579); a throwaway test with a long allowance absorbs it.
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplUITests/testTabsSwitch \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            > warm-up.log 2>&1 || echo "::warning::UI warm-up test failed (see warm-up.log in ui-tests-result)"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath RpplUITests.xcresult \
            2>&1 | tee ui-tests.log

      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/export_screenshots.py RpplUITests.xcresult out/iphone

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shots-iphone
          path: out
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-result
          path: |
            ui-tests.log
            warm-up.log
            RpplUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  watch-ui-tests:
    name: UI tests (Apple Watch Simulator)
    needs: [build, changes]
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      # Seeded mock logbook + frozen clock: the app reads `-rpplUITest` (Debug only), see
      # RpplWatch/App/UITestFixtures.swift. The screenshots come from the `watch-devices` cells.
      - name: xcodebuild test (RpplWatchUITests)
        shell: bash
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" watchsimulator)"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("Apple Watch") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no Apple Watch simulator available")')"
          # Boot first: a cold simulator made the runner fail to launch and every wait time out.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm-up: the first launch on a cold watch simulator hung twice in CI; let a throwaway
          # test absorb it, then run the real thing.
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testStartPage \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            > warm-up.log 2>&1 || echo "::warning::Watch warm-up test failed (see warm-up.log in watch-ui-tests-result)"
          XCTESTRUN="$xctestrun" bash scripts/ci/run_watch_ui_tests.sh "$udid" RpplWatchUITests.xcresult watch-ui-tests.log

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: watch-ui-tests-result
          path: |
            watch-ui-tests.log
            watch-ui-tests.log.attempt1
            warm-up.log
            RpplWatchUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Watch screenshots on the newest regular Watch and the newest Ultra. Only the screenshot class runs here
  # (the whole suite already runs in `watch-ui-tests`); products come from the one build.
  watch-devices:
    name: Watch screenshots ${{ matrix.variant }}
    needs: [build, changes]
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: series11, device: "Apple Watch Series 11 (46mm)" }
          - { variant: ultra3, device: "Apple Watch Ultra 3 (49mm)" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: xcodebuild test (RpplWatchScreenshotTests)
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" watchsimulator)"
          udid="$(python3 scripts/ci/pick_simulator.py "$DEVICE")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm-up, see watch-ui-tests: the first launch on a cold watch simulator hangs.
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testStartPage \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            > warm-up.log 2>&1 || echo "::warning::Watch warm-up test failed (see warm-up.log in the result artifact)"
          XCTESTRUN="$xctestrun" ONLY_TESTING=RpplWatchUITests/RpplWatchScreenshotTests \
            bash scripts/ci/run_watch_ui_tests.sh "$udid" Watch.xcresult watch-screenshots.log

      - name: Collect screenshots
        if: ${{ !cancelled() }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/ci/export_screenshots.py Watch.xcresult "out/watch/$VARIANT"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shots-watch-${{ matrix.variant }}
          path: out
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-watch-${{ matrix.variant }}
          path: |
            watch-screenshots.log
            watch-screenshots.log.attempt1
            warm-up.log
            Watch.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Layout screenshots for wide and rotated windows, the stand-in for iPhone Duo until a real device or
  # the Duo simulator is on the runners: iPad (regular width, live window resizing) and iPhone landscape,
  # portrait and landscape, at the default and the largest accessibility text size. Was its own workflow
  # (ui-layout-screenshots.yml); it lives here so the four cells reuse the build instead of compiling
  # four more times. Runs RpplLayoutScreenshotTests only (it skips itself without RPPL_LAYOUT_SHOTS, so
  # the other UI jobs never run it). The promax-default cell also runs RpplDuoScreenshotTests (iPhone Duo
  # stand-in, folded and unfolded). Output: layouts/<variant>/ and duo/, merged by `layouts-merge`.
  # The UI tests again at the largest accessibility text size, on the smallest and the largest
  # supported iPhone (#517, #548). Screenshots of this size come from `layouts`.
  ui-tests-text:
    name: UI tests ${{ matrix.variant }}
    needs: [build, changes]
    if: needs.changes.outputs.phone == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: se-ax5, device: "iPhone SE (3rd generation)", text: accessibility-extra-extra-extra-large }
          - { variant: promax-ax5, device: "iPhone 17 Pro Max", text: accessibility-extra-extra-extra-large }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: xcodebuild test (RpplUITests)
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          TEXT: ${{ matrix.text }}
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" iphonesimulator)"
          udid="$(python3 scripts/ci/pick_simulator.py "$DEVICE")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" content_size "$TEXT"
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          # Warm-up, see ui-tests: the first launch on a fresh simulator is slow.
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplUITests/testTabsSwitch \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            > warm-up.log 2>&1 || echo "::warning::UI warm-up test failed (see warm-up.log in the result artifact)"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath RpplUITests.xcresult \
            2>&1 | tee ui-tests.log

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-ui-${{ matrix.variant }}
          path: |
            ui-tests.log
            warm-up.log
            RpplUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  layouts:
    name: Layout screenshots ${{ matrix.variant }}
    needs: [build, changes]
    if: needs.changes.outputs.phone == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: ipad-default, device: "iPad Pro 13-inch (M5)", text: large }
          - { variant: ipad-ax5, device: "iPad Pro 13-inch (M5)", text: accessibility-extra-extra-extra-large }
          - { variant: promax-default, device: "iPhone 17 Pro Max", text: large, duo: "1" }
          - { variant: promax-ax5, device: "iPhone 17 Pro Max", text: accessibility-extra-extra-extra-large }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: xcodebuild test (RpplLayoutScreenshotTests)
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          TEXT: ${{ matrix.text }}
          TEST_RUNNER_RPPL_LAYOUT_SHOTS: "1"
          TEST_RUNNER_RPPL_DUO_SHOTS: ${{ matrix.duo }}
        run: |
          set -euo pipefail
          xctestrun="$(bash scripts/ci/unpack_test_products.sh "$RUNNER_TEMP/test-products.tar" "$RUNNER_TEMP/Products" iphonesimulator)"
          udid="$(python3 scripts/ci/pick_simulator.py "$DEVICE")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" content_size "$TEXT"
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          # Warm-up, see ui-tests: the first launch on a fresh simulator is slow.
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplUITests/testTabsSwitch \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            > warm-up.log 2>&1 || echo "::warning::UI warm-up test failed (see warm-up.log in the result artifact)"
          # Only the Duo cell sets RPPL_DUO_SHOTS; elsewhere that test class would skip itself anyway.
          DUO_TEST=""; [ -n "${TEST_RUNNER_RPPL_DUO_SHOTS:-}" ] && DUO_TEST="-only-testing:RpplUITests/RpplDuoScreenshotTests"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplLayoutScreenshotTests \
            ${DUO_TEST} \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath Layouts.xcresult \
            2>&1 | tee layouts.log

      - name: Collect screenshots
        if: ${{ !cancelled() }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/ci/export_screenshots.py Layouts.xcresult screenshots
          mkdir -p "out/layouts/$VARIANT"
          cp screenshots/layout-*.png "out/layouts/$VARIANT/"
          # Duo shots are the ones without the layout- prefix.
          if ls screenshots/* | grep -qv '/layout-'; then
            mkdir -p out/duo
            for f in screenshots/*.png; do case "$(basename "$f")" in layout-*) ;; *) cp "$f" out/duo/ ;; esac; done
          fi

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shots-layouts-${{ matrix.variant }}
          path: out
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-layout-${{ matrix.variant }}
          path: |
            layouts.log
            warm-up.log
            Layouts.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # One screenshot bundle per run instead of one artifact per job: screenshots.zip ->
  # iphone/, watch/<device>/, layouts/<variant>/ and duo/. The job name is pinned by the ruleset.
  layouts-merge:
    name: Merge layout screenshots
    needs: [changes, ui-tests, watch-devices, layouts]
    if: ${{ !cancelled() && (needs.changes.outputs.phone == 'true' || needs.changes.outputs.watch == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download cell screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: shots-*
          path: merged
          merge-multiple: true

      - name: Upload one screenshot bundle
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: merged
          if-no-files-found: warn
          retention-days: 14

      # Fork PRs get a read-only token, so they only get the artifact.
      - name: Comment screenshot link
        if: ${{ steps.bundle.outputs.artifact-url && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- screenshots -->'
          printf '%s\n### Screenshots (mock data)\n\n[Download the zip](%s) · `%s`\n\n- `iphone/`: the app on the default iPhone\n- `watch/<series11|ultra3>/`: the Watch app\n- `layouts/<ipad|promax>-<default|ax5>/`: wide and rotated windows, portrait and landscape\n- `duo/`: iPhone Duo stand-in (17 Pro Max), folded and unfolded\n' "$marker" "$ARTIFACT_URL" "${SHA:0:7}" > comment.md
          # Older runs left one comment per artifact; drop them so the PR keeps this single one.
          for old in '<!-- ui-screenshots -->' '<!-- watch-ui-screenshots -->' '<!-- layout-screenshots -->' '<!-- ui-matrix-screenshots -->'; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$old\")) | .id" |
              while read -r oid; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$oid" >/dev/null || true; done
          done
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

      - name: Fail if any layout cell failed
        if: ${{ needs.layouts.result == 'failure' }}
        run: |
          echo "A layout cell failed; see the cell logs."
          exit 1
