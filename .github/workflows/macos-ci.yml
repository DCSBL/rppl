# macOS checks: full test run and a dry-run build of every app target (iOS + embedded Watch/widgets).
# Public repo = free macOS runners. The Release build stays in Xcode Cloud (Docs/Release.md);
# nothing here signs, archives or uploads.
#
# Warnings and errors from the compiler become inline PR annotations through
# .github/xcode-problem-matcher.json (GitHub caps this at 10 per step, 50 per job; the full log is
# the `*-log` artifact). The Linux core-tests.yml stays as the fast, container-based check.
#
# No `paths:` filter: the jobs always report a status, so they can be required checks.

name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: RpplCore tests + coverage floor
        shell: bash # pipefail: keep the script's exit code through tee
        run: |
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          python3 scripts/check-core-coverage.py 2>&1 | tee core-tests.log

      - name: App unit tests (iOS Simulator)
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplTests \
            -resultBundlePath RpplTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee app-tests.log

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: |
            core-tests.log
            app-tests.log
            RpplTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (dry run)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      # Same invocation as scripts/git-hooks/xcode-gate.sh: the Rppl scheme embeds Watch + widgets.
      - name: xcodebuild build (iOS + Watch)
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          xcodebuild build \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build.log

      - name: Warning / error summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Build"
            echo "errors: $(sort -u build.log | grep -cE '^/.+:[0-9]+:[0-9]+: error: ' || true)"
            echo "warnings: $(sort -u build.log | grep -cE '^/.+:[0-9]+:[0-9]+: warning: ' || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI tests (iPhone Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seeded mock logbook + frozen clock: the app reads `-rpplUITest` (Debug only), see
      # Rppl/App/UITestFixtures.swift. The screenshot test runs here too (about a minute, no extra
      # build); release-screenshots.yml does the same for releases.
      - name: xcodebuild test (RpplUITests)
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          # Boot first: a cold simulator made the runner fail to launch and every wait time out.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath RpplUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee ui-tests.log

      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/export_screenshots.py RpplUITests.xcresult screenshots

      - name: Upload screenshots
        id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      # Fork PRs get a read-only token, so they only get the artifact.
      - name: Comment screenshot link
        if: ${{ !cancelled() && steps.screenshots.outputs.artifact-url && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- ui-screenshots -->'
          printf '%s\n### UI screenshots (mock data)\n\n[Download the screenshots](%s) · `%s`\n' "$marker" "$ARTIFACT_URL" "${SHA:0:7}" > comment.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-result
          path: |
            ui-tests.log
            RpplUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  watch-ui-tests:
    name: UI tests (Apple Watch Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seeded mock logbook + frozen clock: the app reads `-rpplUITest` (Debug only), see
      # RpplWatch/App/UITestFixtures.swift. The screenshot test runs here too (about a minute, no extra
      # build); release-screenshots.yml does the same for releases.
      - name: xcodebuild test (RpplWatchUITests)
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("Apple Watch") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no Apple Watch simulator available")')"
          # Boot first: a cold simulator made the runner fail to launch and every wait time out.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath RpplWatchUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee watch-ui-tests.log

      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/export_screenshots.py RpplWatchUITests.xcresult screenshots

      - name: Upload screenshots
        id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      # Fork PRs get a read-only token, so they only get the artifact.
      - name: Comment screenshot link
        if: ${{ !cancelled() && steps.screenshots.outputs.artifact-url && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- watch-ui-screenshots -->'
          printf '%s\n### Watch UI screenshots (mock data)\n\n[Download the screenshots](%s) · `%s`\n' "$marker" "$ARTIFACT_URL" "${SHA:0:7}" > comment.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: watch-ui-tests-result
          path: |
            watch-ui-tests.log
            RpplWatchUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
