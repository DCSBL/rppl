# Placeholder for the required checks `Changed paths (UI matrix)` and `Merge UI screenshots`.
# The Watch cells (Series 11, Ultra 3) moved into macos-ci.yml (`watch-devices`) so they reuse its single
# build, and every screenshot now lands in that run's one `screenshots` artifact. The iPhone SE cell was
# disabled (#517) and went with this file's other jobs; the se-ax5 and promax-ax5 UI tests are back as
# `ui-tests-text` in macos-ci.yml.
# Once the ruleset no longer requires these two checks, delete this workflow.

name: UI test matrix

on:
  pull_request:
    branches: [main, 'wip/**']
  workflow_dispatch:

concurrency:
  group: ui-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (UI matrix)
    runs-on: ubuntu-24.04
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect UI relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Resolve outside `if` so a failed `git diff` aborts instead of looking like "no changes".
          changed="$(git diff --name-only "$BASE...$HEAD")"
          # Park YAML is checked by parks-validate.yml and the Core tests, not by simulator runs.
          changed="$(printf '%s\n' "$changed" | grep -Ev '^RpplCore/Sources/RpplCore/Resources/Parks/.*\.ya?ml$' || true)"
          if printf '%s\n' "$changed" | grep -Eq '^(Rppl/|RpplWatch/|RpplWidgets/|RpplCore/|RpplUITests/|RpplWatchUITests/|Rppl\.xcodeproj/|scripts/ci/|\.github/workflows/ui-matrix\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  merge:
    name: Merge UI screenshots
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Moved
        run: echo "UI screenshots are collected by macos-ci.yml ('Merge layout screenshots'); nothing to do here."
