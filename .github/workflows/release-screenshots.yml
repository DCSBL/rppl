# Release screenshots and App Store marketing assets for every release (betas too), seeded mock data
# (UITestFixtures) on an iPhone and an Apple Watch Simulator.
#
# - screenshots-required: only the four shots marketing/marketing.yaml uses (3 iPhone, 1 Watch). Tests retry
#   once, and whatever was captured is exported even when a test fails. The job fails only if one of the four
#   PNGs is missing. They are attached to the release as iphone-*/watch-* assets.
# - screenshots-extra: everything else (dark mode, other scenarios). Parallel and allowed to fail: a failure
#   is a warning and blocks nothing.
# - screenshots-duo: three iPhone Duo shots (folded session list, unfolded session detail and parks), attached
#   as duo-*. Optional like screenshots-extra; a wide iPhone stands in until the Duo simulator is on the runners.
# - marketing: renders the App Store assets from the required shots and attaches one zip. Needs only
#   screenshots-required.
# - release-notes: rebuilds the Screenshots section of the release description from the assets on the release,
#   embedding at most 3 per device type (iPhone, Duo, Watch) and attaching the rest as one zip.
# Runs on publish; for an existing release use "Run workflow" with its tag. A manual run only renders the
# marketing assets from the screenshot assets already on that release; tick regenerate_screenshots to make
# them again. A manual run renders with marketing/ from the branch you pick.
# The tag reaches the shell only through env, never interpolated.

name: "Release: screenshots and marketing assets"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      regenerate_screenshots:
        description: Run the simulator screenshots again (off = reuse the iphone-*/watch-* assets on the release)
        type: boolean
        default: false

concurrency:
  group: release-screenshots-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots-required:
    name: Required screenshots (iPhone + Watch)
    if: github.event_name == 'release' || inputs.regenerate_screenshots
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: iPhone screenshots
        id: iphone
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplScreenshotTests/testLogbookThreeSessions \
            -only-testing:RpplUITests/RpplScreenshotTests/testTrackedSessionDetail \
            -only-testing:RpplUITests/RpplScreenshotTests/testParksOpen \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1
          status=$?
          # The full log is huge; keep the failure reasons visible instead of only the last lines.
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild.log | head -60 || true
          tail -20 xcodebuild.log
          exit "$status"

      - name: Export iPhone screenshots
        if: always()
        run: python3 scripts/ci/export_screenshots.py Screenshots.xcresult screenshots || true

      - name: Watch screenshot (live riding)
        id: watch
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          # The marketing frame is the Apple Watch Ultra 3 (422x514 screen): prefer an Ultra, newest runtime first.
          watches = [d for _, ds in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) for d in ds
                     if d["name"].startswith("Apple Watch") and d["isAvailable"]]
          ultras = [d for d in watches if "Ultra" in d["name"]]
          if not watches:
              sys.exit("no Apple Watch simulator available")
          print((ultras or watches)[0]["udid"])')"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm-up: the first launch on a cold watch simulator hung twice in CI; let a throwaway
          # test absorb it (also builds), then run the real thing.
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testStartPage \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            >/dev/null 2>&1 || true
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testLiveRiding \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath WatchScreenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild-watch.log 2>&1
          status=$?
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild-watch.log | head -60 || true
          tail -20 xcodebuild-watch.log
          exit "$status"

      - name: Export Watch screenshot
        if: always()
        run: python3 scripts/ci/export_screenshots.py WatchScreenshots.xcresult screenshots-watch || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots-watch/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-required-logs
          path: |
            xcodebuild.log
            xcodebuild-watch.log
          if-no-files-found: ignore
          retention-days: 14

      # Before the check: a missing Watch shot (the Watch simulator hangs now and then) must not keep the iPhone shots
      # off the release.
      - name: Attach to release
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          for f in screenshots/*.png; do cp "$f" "iphone-$(basename "$f")"; done
          for f in screenshots-watch/*.png; do cp "$f" "watch-$(basename "$f")"; done
          files=(iphone-*.png watch-*.png)
          [ "${#files[@]}" -gt 0 ] && gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          exit 0

      - name: Check the required shots exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for n in 02-logbook-3-1 04-session-tracked-2 06-parks-open-1; do
            [ -f "screenshots/$n.png" ] || { echo "::error::required iPhone shot $n is missing"; missing=1; }
          done
          [ -f screenshots-watch/06-live-riding.png ] || { echo "::error::required Watch shot 06-live-riding is missing"; missing=1; }
          exit "$missing"

  screenshots-extra:
    name: Extra screenshots (optional)
    if: github.event_name == 'release' || inputs.regenerate_screenshots
    runs-on: macos-26
    timeout-minutes: 60
    # Optional shots: a failure here is a warning, never a failed release run.
    continue-on-error: true
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: iPhone screenshots (the rest, dark mode)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplScreenshotTests \
            -skip-testing:RpplUITests/RpplScreenshotTests/testLogbookThreeSessions \
            -skip-testing:RpplUITests/RpplScreenshotTests/testTrackedSessionDetail \
            -skip-testing:RpplUITests/RpplScreenshotTests/testParksOpen \
            -only-testing:RpplUITests/RpplDarkScreenshotTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild.log | head -60 || true
          tail -20 xcodebuild.log
          exit "$status"

      - name: Export iPhone screenshots
        if: always()
        run: python3 scripts/ci/export_screenshots.py Screenshots.xcresult screenshots || true

      - name: Watch screenshots (the rest)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          # The marketing frame is the Apple Watch Ultra 3 (422x514 screen): prefer an Ultra, newest runtime first.
          watches = [d for _, ds in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) for d in ds
                     if d["name"].startswith("Apple Watch") and d["isAvailable"]]
          ultras = [d for d in watches if "Ultra" in d["name"]]
          if not watches:
              sys.exit("no Apple Watch simulator available")
          print((ultras or watches)[0]["udid"])')"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testStartPage \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            >/dev/null 2>&1 || true
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests \
            -skip-testing:RpplWatchUITests/RpplWatchScreenshotTests/testLiveRiding \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath WatchScreenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild-watch.log 2>&1
          status=$?
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild-watch.log | head -60 || true
          tail -20 xcodebuild-watch.log
          exit "$status"

      - name: Export Watch screenshots
        if: always()
        run: python3 scripts/ci/export_screenshots.py WatchScreenshots.xcresult screenshots-watch || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-extra
          path: |
            screenshots/*.png
            screenshots-watch/*.png
            xcodebuild.log
            xcodebuild-watch.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach to release
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          for f in screenshots/*.png; do cp "$f" "iphone-$(basename "$f")"; done
          for f in screenshots-watch/*.png; do cp "$f" "watch-$(basename "$f")"; done
          files=(iphone-*.png watch-*.png)
          [ "${#files[@]}" -gt 0 ] && gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          exit 0

  screenshots-duo:
    name: iPhone Duo screenshots (optional)
    if: github.event_name == 'release' || inputs.regenerate_screenshots
    runs-on: macos-26
    timeout-minutes: 45
    # Optional shots: a failure here is a warning, never a failed release run.
    continue-on-error: true
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Stand-in for the iPhone Duo until its simulator is on the runners: the largest iPhone, portrait when
      # folded and landscape when unfolded (two panes, like the Duo).
      - name: iPhone Duo screenshots
        continue-on-error: true
        shell: bash
        env:
          TEST_RUNNER_RPPL_DUO_SHOTS: "1"
        run: |
          set -uo pipefail
          udid="$(python3 scripts/ci/pick_simulator.py "iPhone 17 Pro Max")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplDuoScreenshotTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath DuoScreenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild-duo.log 2>&1
          status=$?
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild-duo.log | head -60 || true
          tail -20 xcodebuild-duo.log
          exit "$status"

      - name: Export Duo screenshots
        if: always()
        run: python3 scripts/ci/export_screenshots.py DuoScreenshots.xcresult screenshots-duo || true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-duo
          path: |
            screenshots-duo/*.png
            xcodebuild-duo.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach to release
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          for f in screenshots-duo/*.png; do cp "$f" "duo-$(basename "$f")"; done
          files=(duo-*.png)
          [ "${#files[@]}" -gt 0 ] && gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          exit 0

  marketing:
    name: App Store marketing assets
    needs: screenshots-required
    # A skipped screenshots job (manual run reusing the release assets) is fine; a failed one is not.
    # The extra screenshots never gate this job.
    if: ${{ !cancelled() && needs.screenshots-required.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download screenshots (this run)
        if: needs.screenshots-required.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: shots

      - name: Download screenshots (release assets)
        if: needs.screenshots-required.result == 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'iphone-*.png' --pattern 'watch-*.png' --dir shots
          ls shots/*.png >/dev/null || { echo "::error::release $RELEASE_TAG has no iphone-*/watch-* screenshot assets; run again with regenerate_screenshots"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install renderer
        working-directory: marketing
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Render
        working-directory: marketing
        run: |
          node --test
          node render.mjs --shots ../shots --out ../marketing-out

      - name: Check sizes and alpha
        run: python3 scripts/ci/check_marketing_assets.py marketing-out

      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          (cd marketing-out && zip -qr "../rppl-appstore-assets-${RELEASE_TAG}.zip" .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: appstore-assets
          path: marketing-out
          retention-days: 30

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" "rppl-appstore-assets-${RELEASE_TAG}.zip" --clobber

  release-notes:
    name: Release notes
    needs: [screenshots-required, screenshots-extra, screenshots-duo]
    # Runs once both screenshot jobs are done, whatever their result, and rebuilds the section from the
    # assets that actually exist on the release.
    if: ${{ !cancelled() && needs.screenshots-required.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout in this job, so gh cannot find the repository from a .git directory.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: List the screenshots in the release description
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body -q .body > body.md
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' > assets.txt
          python3 - <<'PY'
          import os, re, urllib.parse
          from pathlib import Path
          tag, repo = os.environ["RELEASE_TAG"], os.environ["GITHUB_REPOSITORY"]
          start, end = "<!-- screenshots:start -->", "<!-- screenshots:end -->"
          # At most this many shots per device type go in the description; the rest go in one zip.
          per_device = 3
          # The shots marketing/marketing.yaml uses come first; the rest follow in name order.
          preferred = ["02-logbook-3-1", "04-session-tracked-2", "06-parks-open-1", "06-live-riding",
                       "02-logbook-folded", "04-session-unfolded", "06-parks-unfolded"]
          names = sorted(n for n in Path("assets.txt").read_text().split() if n.endswith(".png"))
          body = re.sub(re.escape(start) + r".*?" + re.escape(end) + r"\n*", "", Path("body.md").read_text(), flags=re.S).rstrip()
          def pick(prefix):
              mine = [n for n in names if n.startswith(prefix + "-") and not n[:-4].endswith("-dark")]
              rank = lambda n: (0, preferred.index(n[len(prefix) + 1:-4])) if n[len(prefix) + 1:-4] in preferred else (1, 0)
              return sorted(mine, key=rank)[:per_device]
          def rows(files, width):
              return "\n".join(
                  f'<img src="https://github.com/{repo}/releases/download/{urllib.parse.quote(tag)}/{n}" width="{width}" alt="{n[:-4]}">'
                  for n in files
              )
          groups = [("iphone", "iPhone", 220), ("duo", "iPhone Duo", 220), ("watch", "Apple Watch", 160)]
          shown = {prefix: pick(prefix) for prefix, _, _ in groups}
          parts = [f"### Screenshots ({label}, mock data)\n\n{rows(shown[prefix], width)}" for prefix, label, width in groups if shown[prefix]]
          parts.append(f"The remaining screenshots (other scenarios and dark mode) are in `rppl-screenshots-{tag}.zip` attached to this release.")
          section = f"{start}\n" + "\n\n".join(parts) + f"\n{end}\n"
          Path("body.md").write_text(body + "\n\n" + section)
          Path("rest.txt").write_text("\n".join(n for n in names if n not in {f for fs in shown.values() for f in fs}))
          PY
          gh release edit "$RELEASE_TAG" --notes-file body.md

      - name: Zip the remaining screenshots and attach them
        shell: bash
        run: |
          set -euo pipefail
          [ -s rest.txt ] || { echo "No remaining screenshots; no zip."; exit 0; }
          mkdir rest
          while read -r n; do gh release download "$RELEASE_TAG" --pattern "$n" --dir rest; done < rest.txt
          (cd rest && zip -q "../rppl-screenshots-${RELEASE_TAG}.zip" *.png)
          gh release upload "$RELEASE_TAG" "rppl-screenshots-${RELEASE_TAG}.zip" --clobber
