# Release screenshots: seeded mock data (UITestFixtures) on an iPhone and an Apple Watch Simulator, attached to the
# release as assets and listed in its description. Re-running replaces the assets and the section.
# Runs on publish; for an existing release use "Run workflow" with its tag. A manual run only renders the marketing
# assets from the screenshot assets already on that release; tick regenerate_screenshots to make them again.
# The marketing job then renders the App Store assets (marketing/) from these screenshots and attaches one zip to
# the release. It runs for every release (betas and release candidates too) and on manual runs; a manual run
# renders with marketing/ from the branch you pick, so template changes can be tried before a release.
# The tag reaches the shell only through env, never interpolated.

name: Release screenshots

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      regenerate_screenshots:
        description: Run the simulator screenshots again (off = reuse the iphone-*/watch-* assets on the release)
        type: boolean
        default: false

concurrency:
  group: release-screenshots-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    name: screenshots
    if: github.event_name == 'release' || inputs.regenerate_screenshots
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Run screenshot test
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme Rppl \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:RpplUITests/RpplScreenshotTests \
            -only-testing:RpplUITests/RpplDarkScreenshotTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1 || status=$?
          # The full log is huge; keep the failure reasons visible instead of only the last lines.
          grep -E "error:|failed|XCTAssert|Failing tests" xcodebuild.log | head -60 || true
          tail -20 xcodebuild.log
          [ "${status:-0}" -eq 0 ] || exit "$status"
          python3 scripts/ci/export_screenshots.py Screenshots.xcresult screenshots

      - name: Run Watch screenshot test
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if d["name"].startswith("Apple Watch") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()
          sys.exit("no Apple Watch simulator available")')"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm-up: the first launch on a cold watch simulator hung twice in CI; let a throwaway
          # test absorb it (also builds), then run the real thing.
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests/testStartPage \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            >/dev/null 2>&1 || true
          xcodebuild test \
            -project Rppl.xcodeproj \
            -scheme RpplWatch \
            -destination "platform=watchOS Simulator,id=${udid}" \
            -only-testing:RpplWatchUITests/RpplWatchScreenshotTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -resultBundlePath WatchScreenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -40
          python3 scripts/ci/export_screenshots.py WatchScreenshots.xcresult screenshots-watch

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots-watch/*.png
          retention-days: 30

      - name: Attach to release
        shell: bash
        run: |
          set -euo pipefail
          for f in screenshots/*.png; do cp "$f" "iphone-$(basename "$f")"; done
          for f in screenshots-watch/*.png; do cp "$f" "watch-$(basename "$f")"; done
          gh release upload "$RELEASE_TAG" iphone-*.png watch-*.png --clobber
          gh release view "$RELEASE_TAG" --json body -q .body > body.md
          python3 - <<'PY'
          import os, re, urllib.parse
          from pathlib import Path
          tag, repo = os.environ["RELEASE_TAG"], os.environ["GITHUB_REPOSITORY"]
          start, end = "<!-- screenshots:start -->", "<!-- screenshots:end -->"
          body = re.sub(re.escape(start) + r".*?" + re.escape(end) + r"\n*", "", Path("body.md").read_text(), flags=re.S).rstrip()
          def rows(prefix, width, dark=False):
              return "\n".join(
                  f'<img src="https://github.com/{repo}/releases/download/{urllib.parse.quote(tag)}/{p.name}" width="{width}" alt="{p.stem}">'
                  for p in sorted(Path(".").glob(f"{prefix}-*.png"))
                  if p.stem.endswith("-dark") == dark
              )
          section = (
              f"{start}\n### Screenshots (iPhone, mock data)\n\n{rows('iphone', 220)}\n\n"
              f"### Screenshots (iPhone, dark mode)\n\n{rows('iphone', 220, dark=True)}\n\n"
              f"### Screenshots (Apple Watch, mock data)\n\n{rows('watch', 160)}\n{end}\n"
          )
          Path("body.md").write_text(body + "\n\n" + section)
          PY
          gh release edit "$RELEASE_TAG" --notes-file body.md

  marketing:
    name: marketing assets
    needs: screenshots
    # A skipped screenshots job (manual run reusing the release assets) is fine; a failed one is not.
    if: ${{ !cancelled() && needs.screenshots.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download screenshots (this run)
        if: needs.screenshots.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Download screenshots (release assets)
        if: needs.screenshots.result == 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'iphone-*.png' --pattern 'watch-*.png' --dir shots
          ls shots/*.png >/dev/null || { echo "::error::release $RELEASE_TAG has no iphone-*/watch-* screenshot assets; run again with regenerate_screenshots"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install renderer
        working-directory: marketing
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Render
        working-directory: marketing
        run: |
          node --test
          node render.mjs --shots ../shots --out ../marketing-out

      - name: Check sizes and alpha
        run: python3 scripts/ci/check_marketing_assets.py marketing-out

      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          (cd marketing-out && zip -qr "../rppl-appstore-assets-${RELEASE_TAG}.zip" .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore-assets
          path: marketing-out
          retention-days: 30

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" "rppl-appstore-assets-${RELEASE_TAG}.zip" --clobber
