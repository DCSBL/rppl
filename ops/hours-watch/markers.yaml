# Per-park markers for scripts/hours_watch.py. The page URL comes from `opening.source_url`
# in the park YAML. There is no generic marker (a year on the page says nothing for parks that
# are open all year, or for a restaurant line on the same page). Pick a sentence or heading that
# the park rewrites when the hours change: a season heading ("Openingstijden 2026"), a date
# range or a reopening date. Without an entry a park is only reported when its page text changed.
#
# parkid:
#   present: ["openingstijden 2026"]   # every text must occur on the page; reported when one is gone
#   absent: ["gesloten"]               # no text may occur; reported when one shows up
#   selector: "main"                   # CSS selector for the hash (browser fetch only)
#   fetch: browser                     # skip curl, go straight to Playwright
#   href: "openings.*\\.pdf"           # regex; matching link URLs are added to the page text, so a
#                                      # new PDF URL changes the hash and can be used in present/absent
#
# Texts are matched lowercase on the page text with tags stripped.
aquabest-best:
  present: ["openingstijden 2026"]
beavercreek-roermond:
  fetch: browser                         # single-page JS site, curl gets an empty shell
betuwestrand-beesd:
  present: ["28 mrt t/m 3 jul & 31 aug t/m 27 sep 2026", "4 jul t/m 30 aug 2026"]
burnside-emst:
  present: ["november t/m maart gesloten op reservering"]
dearne-arnemuiden:
  present: ["zondag t/m vrijdag van 9:00 uur tot 17:30 uur"]
deberendonck-wijchen:
  present: ["april gesloten 12.30 – 17.00 mei 15.30 – 20.00"]
dock79-saint-ghislain:
  present: ["opening hours 2026"]
downunder-nieuwegein:
  href: "openingstijden.*\\.pdf"         # hours are a PDF, the link changes with each new version
  present: ["openingstijden-cablepark-2026.pdf"]
ermerstrand-erm:
  present: ["vanaf 22 mei 2026 zal de waterskibaan weer geopend zijn"]
goodlife-hoogstraten:
  present: ["openingsuren 2026"]
kempervennen-westerhoven:
  present: ["25 september 2026 t/m april 2027", "gesloten tot april 2027"]
lakeside-paradise-knokke:
  present: ["vanaf 30 maart t.e.m. de herfstvakantie, elke dag open"]
lunalake-heerhugowaard:
  present: ["zomervakantie: 6 juli t/m 16 augustus 2026"]
outsider-oudenaarde:
  present: ["seizoensabonnement vanaf 2 maart 2026"]   # hours are an image, watch the season text
project7-rotterdam:
  present: ["april* – 12:30-17:00 u mei* 14:00-20:00 u"]
schotsman-kamperland:
  present: ["april – v/a 25 april mei* 14:00 – 20:00 uur"]
seven-twenty-sevenum:
  present: ["geopend van maart t/m oktober", "meivakantie van 25 april tot en met 3 mei 2026"]
stroombroek-braamt:
  fetch: browser                         # JS-rendered site, curl gets an empty shell
terhills-dilsen-stokkem:
  present: ["tot en met 13 september", "vanaf 14 september"]
wakepark-groningen:
