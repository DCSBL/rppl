opening:
  source_url: "https://www.wasserski-hamm.de/"
  booking: none
  note: >-
    Das Saisonende 2026 ist am 25. Oktober, die Saison 2027 startet am 28. März. In den
    Herbstferien ist montags bis freitags von 16:00 bis 18:30 und am Wochenende von 14:00
    bis 17:00 geöffnet. Bahn 2 ist geschlossen.

