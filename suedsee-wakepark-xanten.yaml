    Im Oktober ist freitags von 16 bis 19 Uhr und samstags, sonntags und an Feiertagen von
    13 bis 19 Uhr geöffnet, an einzelnen Tagen ist geschlossen. Die tagesaktuellen Zeiten
    stehen beim Freizeitzentrum Xanten.

